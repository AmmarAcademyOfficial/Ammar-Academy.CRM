<!-- Supabase → Authentication → Emails → "Reset password". Paste this as the message body. -->
<div style="font-family:Arial,Helvetica,sans-serif;background:#f6f6f9;padding:32px 16px;color:#0e0f3b">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px">
    <div style="width:44px;height:44px;border-radius:10px;background:#f7931e;color:#0e0f3b;font-weight:700;font-size:22px;line-height:44px;text-align:center">A</div>
    <h1 style="font-size:20px;margin:20px 0 8px">Reset your password</h1>
    <p style="font-size:14px;line-height:1.6;color:#4a4d6a;margin:0 0 24px">Someone asked to reset the password for your Ammar Academy CRM account. Click the button to choose a new one. The link works once and expires after a short time.</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#0e0f3b;color:#ffffff;text-decoration:none;font-weight:600;font-size:14px;padding:12px 20px;border-radius:8px">Choose a new password</a>
    <p style="font-size:12px;line-height:1.6;color:#7a7d96;margin:24px 0 0">If you did not ask for this, ignore this email; your password stays the same.</p>
  </div>
</div>
